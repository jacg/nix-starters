# https://rust-lang.github.io/rustup/overrides.html#the-toolchain-file

[toolchain]

# You may need to run
#
#   nix flake update rust-overlay
#
# when changing these to more recent versions
channel = "1.96.1" # nix flake update rust-overlay
#channel = "nightly-2024-07-21"

# see https://rust-lang.github.io/rustup/concepts/profiles.html
profile = "default"
#profile = "minimal" # add "clippy" and "rustfmt" to components if you use this


# see https://rust-lang.github.io/rustup/concepts/components.html
components = [ "rust-analyzer", "rust-src" ] # on top of those in the profile

#targets = [ "wasm32-unknown-unknown" ]
